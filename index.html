<style>
:root{
  --humo:#15100C;
  --humo-2:#0D0907;
  --line-dark:#2E241D;
  --cedro:#E6D6BE;
  --line-light:#D2BFA2;
  --ash:#E9E3D8;
  --ash-dim:rgba(233,227,216,.72);
  --ash-faint:rgba(233,227,216,.5);
  --oro:#C9A15B;
  --oro-soft:#E0C48C;
  --oro-faint:rgba(201,161,91,.38);
  --oro-ink:#8A5C2E;
  --ink:#1B1410;
  --ink-2:#3A2C22;
  --muted:#6B5A4A;
  --display:"Fraunces",Georgia,"Times New Roman",serif;
  --sans:"Archivo",system-ui,-apple-system,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
  --pad:clamp(20px,5vw,64px);
  --maxw:1120px;
  --navh:70px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  background:var(--humo);color:var(--ash);
  font-family:var(--sans);font-size:16px;line-height:1.65;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--oro);outline-offset:3px;border-radius:2px}
.wrap{max-width:var(--maxw);margin:0 auto;padding-left:var(--pad);padding-right:var(--pad);width:100%}
.wrap--tight{max-width:820px}

/* portão */
.gate{position:fixed;inset:0;z-index:200;background:var(--humo-2);display:flex;align-items:center;justify-content:center;padding:24px}
.gate[hidden]{display:none}
.gate__box{max-width:430px;text-align:center}
.gate__mark{font-family:var(--display);font-size:24px;letter-spacing:.22em;color:var(--oro);padding-left:.22em}
.gate__q{font-family:var(--display);font-size:clamp(22px,4vw,30px);line-height:1.3;margin-top:24px}
.gate__note{font-size:14px;color:var(--ash-faint);margin-top:15px;line-height:1.6}
.gate__btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:30px}
.gate__deny{display:none;font-size:14.5px;color:var(--ash-dim);margin-top:28px;line-height:1.7}
.gate.denied .gate__q,.gate.denied .gate__btns,.gate.denied .gate__note{display:none}
.gate.denied .gate__deny{display:block}

/* botões */
.btn{
  font-family:var(--sans);font-size:14px;font-weight:500;padding:14px 28px;
  border:1px solid transparent;border-radius:1px;display:inline-flex;align-items:center;gap:9px;
  cursor:pointer;background:none;color:inherit;
  transition:background .25s ease,color .25s ease,border-color .25s ease,transform .25s ease;
}
.btn--gold{background:var(--oro);color:var(--humo-2)}
.btn--gold:hover{background:var(--oro-soft);transform:translateY(-2px)}
.btn--ghost{border-color:rgba(233,227,216,.3);color:var(--ash)}
.btn--ghost:hover{border-color:var(--oro);color:var(--oro-soft);transform:translateY(-2px)}
.btn--dark{background:var(--ink);color:var(--cedro)}
.btn--dark:hover{background:var(--humo);transform:translateY(-2px)}
.btn--line{border-color:var(--line-light);color:var(--ink)}
.btn--line:hover{border-color:var(--ink);transform:translateY(-2px)}

/* nav */
header.nav{position:fixed;top:0;left:0;right:0;z-index:50;border-bottom:1px solid transparent;transition:background .35s ease,border-color .35s ease}
header.nav.solid{background:rgba(21,16,12,.94);backdrop-filter:blur(10px);border-bottom-color:var(--line-dark)}
.nav__in{display:flex;align-items:center;justify-content:space-between;height:var(--navh)}
.brand{font-family:var(--display);font-size:19px;letter-spacing:.2em;color:var(--ash);padding-left:.2em}
.brand__c{font-style:italic;color:var(--oro);letter-spacing:.12em}
.nav__links{display:flex;gap:30px;align-items:center}
.nav__links a{font-size:13.5px;color:var(--ash-faint);transition:color .25s ease}
.nav__links a:hover{color:var(--oro-soft)}
@media(max-width:880px){.nav__links{display:none}}

/* cabeçalho do guia */
.top{padding:calc(var(--navh) + clamp(56px,9vw,104px)) 0 clamp(50px,7vw,80px);position:relative;overflow:hidden}
.top::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(110% 70% at 50% -10%,rgba(201,161,91,.12),transparent 60%)}
.top__in{position:relative;max-width:720px}
.eyebrow{font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.24em;text-transform:uppercase;color:var(--oro)}
.sec--cedro .eyebrow{color:var(--oro-ink)}
h1{font-family:var(--display);font-weight:400;font-size:clamp(31px,5.4vw,60px);line-height:1.1;margin-top:18px;letter-spacing:-.018em}
h1 em{font-style:italic;color:var(--oro-soft)}
.top__lead{font-family:var(--display);font-size:clamp(17px,2.1vw,21px);line-height:1.55;color:var(--ash-dim);margin-top:26px;max-width:600px}

/* índice */
.toc{display:flex;flex-wrap:wrap;gap:10px;margin-top:38px}
.toc a{
  font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;
  padding:9px 15px;border:1px solid var(--line-dark);border-radius:1px;color:var(--ash-faint);
  transition:border-color .25s ease,color .25s ease;
}
.toc a:hover{border-color:var(--oro);color:var(--oro-soft)}

/* seções */
section{padding:clamp(66px,9vw,110px) 0;scroll-margin-top:calc(var(--navh) + 14px)}
.sec--cedro{background:var(--cedro);color:var(--ink)}
h2{font-family:var(--display);font-weight:400;font-size:clamp(25px,3.7vw,39px);line-height:1.16;letter-spacing:-.012em}
h2 em{font-style:italic;color:var(--oro-soft)}
.sec--cedro h2 em{color:var(--oro-ink)}
.rule{width:40px;height:1px;background:var(--oro);margin-top:22px}
.sec--cedro .rule{background:var(--oro-ink)}
.sec__head h2{margin-top:16px}
.lead{font-size:16.5px;margin-top:22px;max-width:620px;color:var(--ash-dim)}
.sec--cedro .lead{color:var(--muted)}

.prose{max-width:660px;margin-top:34px}
.prose p{font-size:16.5px;line-height:1.8;color:var(--ash-dim);margin-bottom:20px}
.sec--cedro .prose p{color:var(--ink-2)}
.prose p:last-child{margin-bottom:0}
.prose strong{font-weight:500;color:var(--ash)}
.sec--cedro .prose strong{color:var(--ink)}

/* diagrama */
.fig{margin-top:42px}
.fig svg{width:100%;height:auto;display:block}
.fig figcaption{
  font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--muted);margin-top:18px;padding-top:14px;border-top:1px solid var(--line-light);
}
.dg-label{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;fill:var(--oro-ink)}
.dg-sub{font-family:var(--sans);font-size:12.5px;fill:var(--muted)}
.dg-line{stroke:var(--line-light);stroke-width:1}

/* origens */
.origens{display:grid;grid-template-columns:repeat(auto-fit,minmax(238px,1fr));gap:1px;margin-top:44px;background:var(--line-dark);border:1px solid var(--line-dark)}
.org{background:var(--humo);padding:clamp(24px,3.4vw,32px)}
.org__n{font-family:var(--display);font-size:clamp(19px,2.3vw,23px);line-height:1.25}
.org__tag{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--oro);margin-top:9px}
.org__d{font-size:15px;line-height:1.72;color:var(--ash-dim);margin-top:14px}

/* passos */
.passos{margin-top:44px;border-top:1px solid var(--line-light)}
.passo{display:grid;grid-template-columns:118px 1fr;gap:clamp(16px,4vw,40px);padding:26px 0;border-bottom:1px solid var(--line-light);align-items:baseline}
.passo__k{font-family:var(--mono);font-size:12px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--oro-ink)}
.passo__t{font-family:var(--display);font-size:clamp(19px,2.3vw,23px);line-height:1.3}
.passo__d{font-size:15.5px;line-height:1.74;color:var(--muted);margin-top:8px}
@media(max-width:700px){.passo{grid-template-columns:1fr;gap:8px;align-items:start}}

/* erros — vive sobre o cedro, então usa a paleta clara */
.erros__t{margin-top:clamp(46px,6vw,64px)}
.erros{max-width:700px;margin-top:26px;list-style:none;border-top:1px solid var(--line-light)}
.erros li{
  display:grid;grid-template-columns:26px 1fr;gap:0 14px;
  padding:20px 0;border-bottom:1px solid var(--line-light);
}
.erros li::before{
  content:"×";font-family:var(--mono);font-size:17px;line-height:1.3;
